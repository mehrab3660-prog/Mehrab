name: Build Warehouse Serial Extractor exe

on:
  push:
    branches:
      - "**"
    paths:
      - "warehouse-serial-extractor/**"
      - ".github/workflows/build-warehouse-extractor-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: warehouse-serial-extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # پایتون ۳.۹ به بعد دیگه از ویندوز ۷ پشتیبانی نمی‌کنه (به DLL هایی مثل
          # api-ms-win-core-path-l1-1-0.dll نیاز داره که تو ویندوز ۷ نیست).
          # ۳.۸ آخرین نسخه‌ی کاملاً سازگار با ویندوز ۷ هست.
          python-version: "3.8"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build exe
        shell: bash
        run: |
          set -e
          python -m PyInstaller --name WarehouseSerialExtractor --collect-all selenium --collect-all webdriver_manager --noconfirm extract_serials.py

      - name: Bundle Universal CRT DLLs locally (for Windows 7 targets missing it)
        shell: pwsh
        run: |
          # ویندوز ۷ به‌صورت پیش‌فرض UCRT (که هر برنامه پایتونی به آن نیاز
          # دارد) را ندارد و نصب vc_redist روی بعضی سیستم‌های قدیمی/بدون
          # آپدیت هم کارساز نیست. راه‌حل رسمی مایکروسافت برای همین حالت،
          # "local/app-relative deployment" است: خودِ DLL های UCRT را کنار
          # exe می‌گذاریم تا برنامه اصلاً به UCRT نصب‌شده روی سیستم مقصد
          # وابسته نباشد. (See: https://learn.microsoft.com/cpp/windows/universal-crt-deployment)
          #
          # ۱) اول از Windows SDK (اگر روی runner باشد) فقط DLL های خود UCRT
          #    (api-ms-win-crt-*.dll + ucrtbase.dll) را برمی‌داریم.
          $dest = "dist\WarehouseSerialExtractor"
          $candidates = @(
            "C:\Program Files (x86)\Windows Kits\10\Redist\*\ucrt\DLLs\x64",
            "C:\Program Files (x86)\Windows Kits\10\Redist\ucrt\DLLs\x64"
          )
          foreach ($pattern in $candidates) {
            $dir = Get-ChildItem $pattern -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $dir -and (Test-Path $pattern)) { $dir = Get-Item $pattern }
            if ($dir) {
              Copy-Item "$($dir.FullName)\*.dll" -Destination $dest -Force
              Write-Host "Copied UCRT redist DLLs from $($dir.FullName) into $dest"
              break
            }
          }

          # ۲) این تنها نصفِ ماجراست: ucrtbase.dll خودش به یک سری فایل دیگر
          #    به نام api-ms-win-core-*.dll نیاز دارد (که جای دیگری روی
          #    Windows SDK نیستند). این‌ها فقط داخل بسته رسمی vc_redist
          #    مایکروسافت هستند، پس خودِ همان نصب‌کننده را دانلود و باز
          #    می‌کنیم (بدون این‌که واقعاً نصبش کنیم) و هر DLL مرتبطی که
          #    پیدا شود را هم اضافه می‌کنیم.
          # vc_redist.x64.exe از نوع WiX Burn bundle است: با /layout فقط
          # خودش را دوباره کپی می‌کند (نه محتوای واقعی‌اش) چون /layout به
          # یک manifest/channel آنلاین که در دسترس این runner نیست نیاز
          # دارد. به‌جایش با 7-Zip (که روی runnerهای گیت‌هاب از قبل نصب
          # است) مستقیماً به‌عنوان یک آرشیو بازش می‌کنیم.
          $layoutDir = "$PWD\vcredist_layout"
          New-Item -ItemType Directory -Force -Path $layoutDir | Out-Null
          Write-Host "Downloading vc_redist.x64.exe..."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe" -UseBasicParsing
          $downloaded = Get-Item "vc_redist.x64.exe" -ErrorAction SilentlyContinue
          Write-Host "Downloaded file size: $($downloaded.Length) bytes"

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          # WiX Burn bundles (which vc_redist.x64.exe is) chain several
          # archives back-to-back inside one exe: 7-Zip only unpacks the
          # FIRST one it finds and reports how many bytes of "data after
          # the end of archive" are left over. We keep carving out that
          # leftover tail into its own file and re-running 7-Zip on it
          # until there's nothing meaningful left, so we reach every
          # embedded container instead of just the first (small) one.
          # نکته مهم: خروجی 7z معمولاً چند خط "Physical Size = " دارد (یکی
          # برای خودِ فایل PE بیرونی، یکی برای هر آرشیو تودرتو). باید
          # همیشه آخرین مقدار (مربوط به عمیق‌ترین/جدیدترین آرشیو پیدا شده)
          # را برداریم، نه اولین - وگرنه offset اشتباه (کل حجم فایل) برداشته
          # می‌شود و carve یک فایل خالی می‌سازد.
          $currentFile = (Resolve-Path "vc_redist.x64.exe").Path
          for ($i = 0; $i -lt 6; $i++) {
            $outDir = Join-Path $layoutDir "layer_$i"
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            Write-Host "--- 7-Zip pass $i on $currentFile ---"
            # از cmd.exe برای اجرا استفاده می‌کنیم تا stderr خروجی 7z به‌صورت
            # متن ساده بیاید، نه به‌عنوان PowerShell ErrorRecord (که باعث
            # می‌شد کل step به‌خاطر یک هشدار/خطای بی‌ضرر fail شود).
            $sevenZipOutput = cmd /c "`"$sevenZip`" x `"$currentFile`" `"-o$outDir`" -y 2>&1"
            Write-Host ($sevenZipOutput -join "`n")

            $tailMatches = $sevenZipOutput | Select-String -Pattern "Tail Size = (\d+)" -AllMatches
            $physicalMatches = $sevenZipOutput | Select-String -Pattern "Physical Size = (\d+)" -AllMatches
            if (-not $tailMatches -or -not $physicalMatches) {
              Write-Host "No more 'data after the end of archive' reported - stopping the carve loop."
              break
            }

            $tailSize = [int64]($tailMatches.Matches | Select-Object -Last 1).Groups[1].Value
            $physicalSize = [int64]($physicalMatches.Matches | Select-Object -Last 1).Groups[1].Value

            # "Physical Size" is measured FROM WHERE THE NESTED ARCHIVE
            # ITSELF STARTS, not from byte 0 of the file we fed 7z - if 7z
            # also reports an "Offset = N" for that same nested archive
            # (it skipped N bytes of leading data before finding it), the
            # real end-of-archive position is Offset + Physical Size, not
            # Physical Size alone. Missing this was why every previous
            # pass kept re-discovering the exact same small archive.
            $offsetMatches = $sevenZipOutput | Select-String -Pattern "^Offset = (\d+)" -AllMatches
            $offsetValue = 0
            if ($offsetMatches) {
              $offsetValue = [int64]($offsetMatches.Matches | Select-Object -Last 1).Groups[1].Value
            }
            $carvePoint = $offsetValue + $physicalSize
            Write-Host "Physical size (last/innermost): $physicalSize, offset: $offsetValue, carve point: $carvePoint, remaining tail: $tailSize"
            if ($tailSize -lt 1024) {
              Write-Host "Remaining tail is negligible - stopping the carve loop."
              break
            }

            $tailFile = Join-Path $layoutDir "tail_$i.bin"
            $srcStream = [System.IO.File]::OpenRead($currentFile)
            $srcStream.Seek($carvePoint, [System.IO.SeekOrigin]::Begin) | Out-Null
            $tailStream = [System.IO.File]::Create($tailFile)
            $srcStream.CopyTo($tailStream)
            $tailStream.Close()
            $srcStream.Close()
            $tailFileSize = (Get-Item $tailFile).Length
            Write-Host "Carved out tail into $tailFile ($tailFileSize bytes)"
            if ($tailFileSize -lt 1024) {
              Write-Host "Carved file is negligible - stopping the carve loop."
              break
            }
            $currentFile = $tailFile
          }

          $allLayoutFiles = Get-ChildItem -Path $layoutDir -Recurse -ErrorAction SilentlyContinue -File
          Write-Host "Total files found across all extraction layers: $($allLayoutFiles.Count)"

          # هرچه پیدا شد ممکن است هنوز داخلش cab/msi باشد (بدون پسوند
          # درست)؛ روی همه امتحان می‌کنیم، خطا روی فایل‌هایی که آرشیو
          # نیستند بی‌ضرر است.
          foreach ($f in $allLayoutFiles) {
            if ($f.Extension -in @(".dll", ".exe", ".bin")) { continue }
            $outDir = Join-Path $layoutDir ("expanded_" + $f.BaseName + "_" + $f.Directory.Name)
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            cmd /c "`"$sevenZip`" x `"$($f.FullName)`" `"-o$outDir`" -y >NUL 2>&1"
          }
          # Burn هر فایلی که از داخل بسته درمی‌آورد را بدون پسوند اصلی‌اش
          # می‌گذارد، پس نمی‌شود فقط دنبال ".msi" گشت - هر فایلی که هنوز
          # dll/exe/bin نشده را هم با msiexec /a امتحان می‌کنیم (روی
          # فایل‌هایی که واقعاً MSI نیستند، msiexec فقط بی‌سروصدا شکست
          # می‌خورد).
          foreach ($f in ($allLayoutFiles | Where-Object { $_.Extension -notin @(".dll", ".exe", ".bin") })) {
            $outDir = Join-Path $layoutDir ("msiextract_" + $f.BaseName + "_" + $f.Directory.Name)
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            cmd /c "msiexec.exe /a `"$($f.FullName)`" /qn TARGETDIR=`"$outDir`" >NUL 2>&1"
          }
          Write-Host "Waiting for background msiexec admin-installs to finish writing files..."
          Start-Sleep -Seconds 8

          $dllPatterns = @("api-ms-win-*.dll", "ucrtbase.dll", "vcruntime140*.dll", "msvcp140*.dll")
          $dlls = Get-ChildItem -Path $layoutDir -Recurse -ErrorAction SilentlyContinue -File |
            Where-Object { $name = $_.Name; ($dllPatterns | Where-Object { $name -like $_ }).Count -gt 0 }
          Write-Host "Total matching DLL files found anywhere under the extracted payload: $($dlls.Count)"
          if ($dlls) {
            $dlls | Group-Object Name | ForEach-Object { $_.Group[0] } | Copy-Item -Destination $dest -Force
            Write-Host "Bundled $($dlls.Count) CRT/UCRT/apiset DLL files extracted from the VC++ redistributable payload."
          } else {
            Write-Warning "Extracted the VC++ redistributable but found no matching DLL files inside it."
          }

      - name: Verify bundled DLLs
        shell: pwsh
        run: |
          $dest = "dist\WarehouseSerialExtractor"
          $bundled = Get-ChildItem -Path $dest -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "api-ms-win-*.dll" -or $_.Name -eq "ucrtbase.dll" }
          Write-Host "Total api-ms-win-*/ucrtbase DLLs bundled next to the exe: $($bundled.Count)"
          $needle = Get-ChildItem -Path $dest -Filter "api-ms-win-core-path-l1-1-0.dll" -ErrorAction SilentlyContinue
          if ($needle) {
            Write-Host "OK: api-ms-win-core-path-l1-1-0.dll (the exact DLL the user's machine reported missing) IS bundled."
          } else {
            Write-Warning "MISSING: api-ms-win-core-path-l1-1-0.dll was NOT found in the bundle. The fix is incomplete."
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseSerialExtractorSetup
          path: warehouse-serial-extractor/installer_output/WarehouseSerialExtractorSetup.exe
