name: Build Warehouse Serial Extractor exe

on:
  push:
    branches:
      - "**"
    paths:
      - "warehouse-serial-extractor/**"
      - ".github/workflows/build-warehouse-extractor-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: warehouse-serial-extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # پایتون ۳.۹ به بعد دیگه از ویندوز ۷ پشتیبانی نمی‌کنه (به DLL هایی مثل
          # api-ms-win-core-path-l1-1-0.dll نیاز داره که تو ویندوز ۷ نیست).
          # ۳.۸ آخرین نسخه‌ی کاملاً سازگار با ویندوز ۷ هست.
          python-version: "3.8"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build exe
        shell: bash
        run: |
          set -e
          python -m PyInstaller --name WarehouseSerialExtractor --collect-all selenium --collect-all webdriver_manager --noconfirm extract_serials.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseSerialExtractorSetup
          path: warehouse-serial-extractor/installer_output/WarehouseSerialExtractorSetup.exe
