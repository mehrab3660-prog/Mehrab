name: Build Warehouse Serial Extractor exe

on:
  push:
    branches:
      - "**"
    paths:
      - "warehouse-serial-extractor/**"
      - ".github/workflows/build-warehouse-extractor-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: warehouse-serial-extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download Chromium (bundled next to the program)
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          set -e
          python -m playwright install chromium
          python -m playwright install-deps chromium || true

      - name: Build exe
        shell: bash
        run: |
          set -e
          python -m PyInstaller --name WarehouseSerialExtractor --collect-all playwright --noconfirm extract_serials.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseSerialExtractorSetup
          path: warehouse-serial-extractor/installer_output/WarehouseSerialExtractorSetup.exe
