name: Build get_phones exe

on:
  push:
    branches:
      - "**"
    paths:
      - "tools/get_phones/**"
      - ".github/workflows/build-get-phones-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/get_phones
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # shell: bash + "set -e" so a single failed package install fails the
        # build loudly instead of silently shipping a broken exe (pwsh does
        # not stop on a non-zero exit code by default).
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download geckodriver
        # geckodriver مستقیم داخل exe بسته‌بندی می‌شود تا کاربر نهایی موقع
        # اجرا نیازی به دسترسی اینترنت برای دانلود درایور نداشته باشد
        # (Selenium Manager در شبکه‌های محدود/فایروال‌دار می‌تواند بی‌نهایت
        # هنگ کند). با GITHUB_TOKEN به api.github.com احراز هویت می‌شویم تا
        # به محدودیت نرخ درخواست ناشناس (که باعث شکست build می‌شد) نخوریم.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          api_url="https://api.github.com/repos/mozilla/geckodriver/releases/latest"
          response=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api_url")
          dl_url=$(echo "$response" | grep -o '"browser_download_url": *"[^"]*win64[^"]*"' | grep -v aarch64 | head -1 | cut -d '"' -f4)
          if [ -z "$dl_url" ]; then
            echo "::error::Failed to resolve geckodriver download URL. API response was:"
            echo "$response"
            exit 1
          fi
          echo "Downloading $dl_url"
          curl -sSL -o geckodriver.zip "$dl_url"
          unzip -o geckodriver.zip
          rm geckodriver.zip
          ls -la geckodriver.exe

      - name: Build exe
        shell: bash
        run: |
          set -e
          python -m PyInstaller --onefile --windowed --name get_phones --collect-all selenium --add-binary "geckodriver.exe;." --noconfirm get_phones.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: get_phones-windows-exe
          path: tools/get_phones/dist/get_phones.exe
