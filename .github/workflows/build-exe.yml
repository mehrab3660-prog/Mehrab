name: Build Windows exe

on:
  push:
    branches:
      - "**"
    paths:
      - "accounting-app/client/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: accounting-app/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # پایتون ۳.۹ به بعد دیگه از ویندوز ۷ پشتیبانی نمی‌کنه (به DLL هایی مثل
          # api-ms-win-core-path-l1-1-0.dll نیاز داره که تو ویندوز ۷ نیست).
          # ۳.۸ آخرین نسخه‌ی کاملاً سازگار با ویندوز ۷ هست.
          python-version: "3.8"

      - name: Install dependencies
        # shell: bash + "set -e" so that if any single package fails to install
        # (e.g. a version pin incompatible with this Python), the step fails loudly
        # instead of silently continuing to the next line and shipping a broken exe
        # (pwsh does not stop on a non-zero exit code by default).
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build exe
        shell: bash
        run: |
          set -e
          python -m PyInstaller --onefile --windowed --name AccountingApp --icon=assets/icon.ico --add-data "web;web" --add-data "assets;assets" --add-data "fonts;fonts" --hidden-import=socks --noconfirm run_app.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccountingApp-windows-exe
          path: accounting-app/client/dist/AccountingApp.exe
